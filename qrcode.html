<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麗寶萊茵解說牌 QR Code 產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        @media print {
            .no-print { display: none; }
            .print-break { break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 no-print">
            <h1 class="text-2xl font-bold text-slate-800 mb-4">🛠️ 麗寶萊茵 QR Code 批量產生器</h1>
            <p class="text-slate-600 mb-4">請在下方輸入您網站發布後的「正式網址」，系統會自動加上對應的錨點 (#ID) 並生成二維碼。</p>
            
            <div class="flex gap-4">
                <input type="text" id="baseUrl" value="https://tanji2026.github.io/wonderfulplace/" 
                    class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-slate-700"
                    placeholder="例如：https://tanji2026.github.io/wonderfulplace/">
                <button onclick="generateQRs()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition">重新生成</button>
            </div>
            <p class="text-xs text-gray-400 mt-2">*如果是首頁，網址最後面記得要有斜線 /，例如 .../wonderfulplace/</p>
        </div>

        <div id="qrContainer" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- QR Codes will be injected here -->
        </div>
    </div>

    <script>
        // 定義所有項目的 ID 與名稱
        const items = [
            { category: "專題導覽", list: [
                { id: "measures", name: "節能減碳措施" }
            ]},
            { category: "日常節能", list: [
                { id: "lighting", name: "感應照明" },
                { id: "elevator", name: "節能電梯" },
                { id: "smart-meter", name: "智慧電錶" },
                { id: "fridge", name: "公用冰箱" }
            ]},
            { category: "永續生活", list: [
                { id: "water-saving", name: "省水設備" },
                { id: "rainwater", name: "雨水回收" },
                { id: "ev-charging", name: "電動車預留" },
                { id: "recycling", name: "資源回收" },
                { id: "compost", name: "落葉堆肥" },
                { id: "sharing", name: "幸福小站" }
            ]},
            { category: "生態綠化 (原有)", list: [
                { id: "juniperus", name: "鋪地柏" },
                { id: "schefflera-elegantissima", name: "孔雀木" },
                { id: "zanthoxylum", name: "胡椒木" },
                { id: "azalea", name: "杜鵑" },
                { id: "schefflera-arboricola", name: "鵝掌藤" },
                { id: "golden-cypress", name: "黃金扁柏" },
                { id: "nandina", name: "南天竹" },
                { id: "duranta", name: "金露花" },
                { id: "ruellia", name: "翠蘆莉" }
            ]},
            { category: "生態綠化 (新增)", list: [
                { id: "ardisia", name: "大葉紫金牛" },
                { id: "eurya", name: "凹葉柃木" },
                { id: "buddha-bamboo", name: "羅漢竹" },
                { id: "ixora", name: "紅仙丹花" },
                { id: "dracaena", name: "龍血樹" },
                { id: "podocarpus", name: "短葉羅漢松" },
                { id: "cordyline", name: "朱蕉" },
                { id: "gardenia", name: "梔子花" },
                { id: "podocarpus-bonsai", name: "羅漢松(盆栽)" }
            ]},
            { category: "未來願景", list: [
                { id: "future", name: "屋頂農園計畫" }
            ]}
        ];

        function generateQRs() {
            const container = document.getElementById('qrContainer');
            let baseUrl = document.getElementById('baseUrl').value.trim();
            
            // 確保網址結尾沒有 # 或 /index.html (我們需要純淨的 base url)
            baseUrl = baseUrl.split('#')[0];
            if (!baseUrl.endsWith('/') && !baseUrl.endsWith('.html')) {
                // 如果不是以 .html 結尾，補上斜線
                baseUrl += '/';
            }

            let html = '';

            items.forEach(cat => {
                html += `<div class="col-span-2 md:col-span-4 lg:col-span-5 mt-6 mb-2 border-b-2 border-blue-100 pb-1 print-break">
                            <h3 class="font-bold text-blue-600 text-xl flex items-center">
                                <span class="bg-blue-100 w-2 h-6 rounded mr-2 inline-block"></span>
                                ${cat.category}
                            </h3>
                         </div>`;
                
                cat.list.forEach(item => {
                    const fullUrl = `${baseUrl}#${item.id}`;
                    // 使用 API 生成 QR
                    const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(fullUrl)}`;
                    
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center hover:shadow-md transition print-break group">
                            <div class="w-full flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded">#${item.id}</span>
                            </div>
                            <h4 class="font-bold text-lg text-slate-800 mb-2 text-center h-14 flex items-center justify-center">${item.name}</h4>
                            <div class="relative">
                                <img src="${qrSrc}" alt="${item.name} QR Code" class="w-full h-auto border border-gray-100 rounded mb-3">
                            </div>
                            <p class="text-[10px] text-gray-400 break-all text-center leading-tight mb-3 px-2 opacity-50">${fullUrl}</p>
                            <a href="${qrSrc}" download="${item.name}_QR.png" target="_blank" 
                               class="text-xs bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 font-bold py-2 px-4 rounded-full transition w-full text-center no-print">
                               下載圖片
                            </a>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;
        }

        // 頁面載入時先生成一次
        window.onload = generateQRs;
    </script>
</body>
</html>
